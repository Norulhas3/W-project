<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="TACTICAL BRIEFING" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.tw{animation:tw 2.5s ease-in-out infinite}.fl{animation:fl 4s ease-in-out infinite}.sp{animation:sp 8s linear infinite;transform-origin:center;transform-box:fill-box}
.bl{animation:bl 1s step-end infinite}.fa{animation:fa 6s linear infinite}.sw{animation:sw 5s ease-in-out infinite alternate;transform-box:fill-box}.pu{animation:pu 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{opacity:.2}}@keyframes fl{50%{transform:translateY(-10px)}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes bl{50%{opacity:.15}}
@keyframes fa{from{transform:translateY(-60px)}to{transform:translateY(330px)}}@keyframes sw{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}@keyframes pu{50%{transform:scale(1.2);opacity:.5}}</style><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#052e16"/><stop offset="1" stop-color="#0c4a6e"/></linearGradient>
